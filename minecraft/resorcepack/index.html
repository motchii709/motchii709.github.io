<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Resource Pack Generator</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #fff;
            color: #000;
            margin: 20px;
            line-height: 1.5;
        }
        h1 {
            font-size: 24px;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }
        section {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #ccc;
        }
        section h2 {
            font-size: 18px;
            margin-top: 0;
        }
        .field {
            margin-bottom: 10px;
        }
        .field label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        .field input[type="text"], .field select {
            padding: 4px;
        }
        .field input[type="text"]:disabled {
            background-color: #eee;
            color: #999;
        }
        button {
            font-size: inherit;
        }
        .btn {
            cursor: pointer;
            padding: 5px 10px;
            border: 1px solid #888;
            background: #f8f8f8;
        }
        .btn:hover {
            background: #e8e8e8;
        }
        .btn-primary {
            font-size: 18px;
            padding: 10px 30px;
            font-weight: bold;
            display: block;
            margin: 20px auto;
            background: #222;
            color: #fff;
            border: 1px solid #000;
        }
        .btn-primary:hover {
            background: #444;
        }
        .btn-primary:disabled {
            background: #666;
            cursor: not-allowed;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #eee;
        }
        .row-actions {
            display: flex;
            gap: 5px;
        }
    </style>
</head>
<body>

    <h1>Meme Resource Pack Generator</h1>

    <section id="settings">
        <h2>基本設定</h2>
        <div class="field">
            <label for="packName">パック名:</label>
            <input type="text" id="packName" value="Meme Resource Pack">
        </div>
        <div class="field">
            <label for="packDesc">説明:</label>
            <input type="text" id="packDesc" value="Custom meme sounds pack">
        </div>
        <div class="field">
            <label for="mcVersion">マイクラバージョン:</label>
            <select id="mcVersion">
                <option value="34" selected>1.21.1 (pack_format: 34)</option>
                <option value="42">1.21.2 - 1.21.3 (pack_format: 42)</option>
                <option value="46">1.21.4 (pack_format: 46)</option>
            </select>
        </div>
        <div class="field">
            <label>
                <input type="checkbox" id="useProxy" checked> CORSプロキシを使用する
            </label>
        </div>
        <div class="field">
            <label for="proxyUrl">プロキシURL:</label>
            <input type="text" id="proxyUrl" value="https://corsproxy.io/?">
        </div>
        <div class="field">
            <label>
                <input type="checkbox" id="langToggle"> イベント名を日本語で表示
            </label>
        </div>
    </section>

    <section id="mappings">
        <h2>サウンドマッピング</h2>
        <table id="mappingTable">
            <thead>
                <tr>
                    <th>イベント</th>
                    <th>ソース</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <div style="margin-top: 10px;">
            <button class="btn" id="addRowBtn">＋ 行を追加</button>
        </div>
    </section>

    <button class="btn btn-primary" id="generateBtn">リソースパックを生成して保存</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const proxyCheck = document.getElementById('useProxy');
            const proxyInput = document.getElementById('proxyUrl');
            function toggleProxy() {
                proxyInput.disabled = !proxyCheck.checked;
                if (!proxyCheck.checked) proxyInput.style.background = '#eee';
                else proxyInput.style.background = '';
            }
            proxyCheck.addEventListener('change', toggleProxy);
            toggleProxy();
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
